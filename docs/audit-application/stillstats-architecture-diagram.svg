    <rect class="group" x="30" y="120" width="260" height="520" rx="14"/>
    <text class="group-name" x="46" y="148">Creator's browser</text>
  </g>
  <g id="web-app" data-code="apps/web/src/App.tsx apps/api/src/app.ts">
    <rect class="box" x="50" y="170" width="220" height="100" rx="10"/>
    <text class="name" x="160" y="203" text-anchor="middle">Web app</text>
    <text class="note" x="160" y="228" text-anchor="middle">stillstats.com/app</text>
    <text class="note" x="160" y="250" text-anchor="middle">dashboards and settings</text>
  </g>
  <g id="embedded-player" data-code="apps/web/src/youtube-player.ts">
    <rect class="box" x="50" y="320" width="220" height="100" rx="10"/>
    <text class="name" x="160" y="353" text-anchor="middle">YouTube's embedded</text>
    <text class="name" x="160" y="375" text-anchor="middle">player</text>
    <text class="note" x="160" y="400" text-anchor="middle">privacy-enhanced mode</text>
  </g>
  <g id="extension" data-code="apps/extension/src/product-api.ts apps/extension/src/manifest.ts apps/extension/src/entrypoints/studio.content.ts apps/extension/src/entrypoints/youtube.content.ts">
    <rect class="box" x="50" y="480" width="220" height="130" rx="10"/>
    <text class="name" x="160" y="513" text-anchor="middle">Studio extension</text>
    <text class="note" x="160" y="538" text-anchor="middle">Chrome and Firefox, on Studio</text>
    <text class="note" x="160" y="560" text-anchor="middle">and, if turned on, youtube.com</text>
    <text class="note" x="160" y="582" text-anchor="middle">beside YouTube's own figures</text>
  </g>
  <g id="arrow-web-app-player" data-code="apps/web/src/youtube-player.ts">
    <path class="edge" d="M160 270 V316" marker-end="url(#head)"/>
    <text class="label" x="172" y="300">plays a video</text>
  </g>

  <!-- Cloudflare -->
