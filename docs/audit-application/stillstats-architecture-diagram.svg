    <text class="note" x="505" y="416" text-anchor="middle">stillstats.com,</text>
    <text class="note" x="505" y="436" text-anchor="middle">HTTPS at the edge</text>
  </g>
  <g id="arrow-web-app-cloudflare" data-code="apps/web/src/App.tsx">
    <path class="edge" d="M270 220 H426" marker-end="url(#head)"/>
    <text class="label" x="350" y="190" text-anchor="middle">pages and</text>
    <text class="label" x="350" y="207" text-anchor="middle">API requests</text>
  </g>
  <g id="arrow-extension-cloudflare" data-code="apps/extension/src/product-api.ts">
    <path class="edge" d="M270 545 H426" marker-end="url(#head)"/>
    <text class="label" x="350" y="515" text-anchor="middle">requests to the</text>
