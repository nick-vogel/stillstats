name: Release

# A published GitHub release deploys production. The release is published from the release
# note's merge commit, tagged with the bare version, after that commit's CI run pushed its sha
# images. docs/deploy.md describes the steps and what to do when one fails.
on:
  release:
    types: [published]

# Two production migrations must never run at once, so a running release is never cancelled. The
# rollback workflow joins the same group.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/${{ github.repository }}-api
  WORKER_IMAGE: ghcr.io/${{ github.repository }}-worker

jobs:
  # No environment: the tag check, the image check and the release body need no production
  # secret, so production's secrets reach only the jobs after the tag check passes. A refused tag
  # fails this job, and nothing after it runs. An extension tag ends here, green, with no deploy.
  # A pre-release deploys nothing.
  prepare:
    name: Check the tag and the images, and write the release body
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    outputs:
      deploy: ${{ steps.tag.outputs.deploy }}
      version: ${{ steps.tag.outputs.version }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tag must equal the newest app release note in the tagged commit. The command prints
      # deploy= and version= lines, and writes the note's markdown to the notes file.
      - name: Check the tag against the release notes
        id: tag
        run: >-
          pnpm --silent --filter @creator-analytics/releases release-tag-check
          --tag "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: steps.tag.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Check that the tagged commit's images exist
        if: steps.tag.outputs.deploy == 'true'
        run: |
          for image in "$API_IMAGE" "$WORKER_IMAGE"; do
            if ! docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" > /dev/null; then
              echo "::error::$image:sha-$GITHUB_SHA is not on the registry. Publish the release from a commit on main whose CI run has pushed its images, or wait for that run to finish."
              exit 1
            fi
          done
      - name: Replace the release body with the release note
        if: steps.tag.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

  # The release step. It runs the tagged commit's API image migrations against production as the
  # migration role, over an ephemeral Tailscale node, before any new image starts. A failed
  # migration fails this job, and deploy never runs, so latest stays on the last release.
  migrate:
    name: Migrate the production database
    needs: [prepare]
    if: needs.prepare.outputs.deploy == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Connect to the tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          # An OAuth client, not an auth key: a key expires, and an expired key blocks every deploy.
          # Both values are production Environment secrets, like the other deploy secrets
          # (docs/deploy.md, Environments).
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Host networking gives the container the runner's tailnet route and MagicDNS.
      - name: Run the migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: >-
          docker run --rm --network host -e MIGRATION_DATABASE_URL
          "$API_IMAGE:sha-$GITHUB_SHA" pnpm --filter @creator-analytics/database migrate

  deploy:
    name: Deploy production through Dokploy
    needs: [prepare, migrate]
    if: needs.prepare.outputs.deploy == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The version tag and latest move only after the production migration succeeds. The retag
      # happens on the registry, with no pull; --prefer-index=false copies the manifest as is, so
      # sha-<commit>, <version> and latest share one digest.
      - name: Tag the version and move latest to this commit
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$API_IMAGE:$VERSION" --tag "$API_IMAGE:latest" "$API_IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools create --prefer-index=false \
            --tag "$WORKER_IMAGE:$VERSION" --tag "$WORKER_IMAGE:latest" "$WORKER_IMAGE:sha-$GITHUB_SHA"
      - name: Redeploy the API
        env:
          DOKPLOY_WEBHOOK_API: ${{ secrets.DOKPLOY_WEBHOOK_API }}
        run: curl --fail --silent --show-error -X POST "$DOKPLOY_WEBHOOK_API"
      - name: Redeploy the worker
        env:
          DOKPLOY_WEBHOOK_WORKER: ${{ secrets.DOKPLOY_WEBHOOK_WORKER }}
        run: curl --fail --silent --show-error -X POST "$DOKPLOY_WEBHOOK_WORKER"
      # Dokploy #5496: a redeploy on latest can pull the new image and leave the old container
      # running. The API answers its version and commit, so this waits for the new ones. It checks
      # the API only; the worker answers nothing over HTTP.
      - name: Check that the API runs the new image
        run: |
          commit="${GITHUB_SHA:0:7}"
          for attempt in $(seq 1 30); do
            answer="$(curl --fail --silent --show-error https://stillstats.com/api/client-settings || true)"
            if [ -n "$answer" ] && echo "$answer" \
              | jq -e --arg version "$VERSION" --arg commit "$commit" \
                '.version == $version and .commit == $commit' > /dev/null; then
              echo "The API runs $VERSION at $commit."
              exit 0
            fi
            echo "Attempt $attempt: the API answers ${answer:-nothing}"
            sleep 10
          done
          echo "::error::After 5 minutes the API at https://stillstats.com still does not run $VERSION at $commit. Dokploy #5496 can leave the old container running: redeploy the API application in Dokploy, then check https://stillstats.com/api/client-settings by hand."
          exit 1
